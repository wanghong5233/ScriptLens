        - modern_workplace
        - modern_rural
        - ancient_palace
        - ancient_jianghu
        - ancient_folk
        - xianxia
        - xuanhuan
        - apocalypse
        - system_flow
        - rebirth
        - transmigration
        - school
        - mixed

    - dim: protagonist_archetype
      kind: llm
      cardinality: single
      stability_state: stable
      values:
