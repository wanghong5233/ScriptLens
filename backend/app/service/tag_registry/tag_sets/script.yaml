version: script
description: "ScriptLens clean script tagging system (single tag set)"
prompt_ver: "script"
breaking: true

bundles:
  - id: drama_tags
    scope: script
    dims: [drama_tags]
    prompt: prompts/drama_tags.jinja
    output_mode: single_call

  - id: script_structure
    scope: script
    dims:
      - gender_axis
      - world_setting
      - protagonist_archetype
      - antagonist_archetype
      - pacing_mode
      - paid_break_pattern
      - story_arc_template
    prompt: prompts/script_structure.jinja
    output_mode: single_call

  - id: episode_structure
    scope: episode
    dims:
      - episode_opening_type
      - episode_end_hook
      - intra_episode_peak_count
      - paid_break_position
    prompt: prompts/episode_structure.jinja
    output_mode: single_call

  - id: plot_core
    scope: plot_unit
    dims:
      - plot_hook
      - conflict_type
      - story_stage
      - relationship_arc
      - payoff_type
    prompt: prompts/plot_core.jinja
    output_mode: single_call

  - id: plot_emotion
    scope: plot_unit
    dims: [emotional_driver]
    prompt: prompts/plot_emotion.jinja
    output_mode: single_call

  - id: plot_business
    scope: plot_unit
    dims:
      - business_content_archetype
      - business_conflict_bucket
      - business_payoff_bucket
      - business_emotion_bucket
    prompt: prompts/plot_business.jinja
    output_mode: single_call

  - id: asr
    scope: plot_unit
    dims:
      - dialogue_density
      - speech_style
      - cta_type
      - voiceover_type
      - emotional_keywords
      - keyword_theme
    prompt: prompts/asr.jinja
    output_mode: single_call
    rule_overrides:
      dialogue_density: rule
      voiceover_type: rule

  - id: storyboard_hints
    scope: plot_unit
    dims:
      - scene_locale_type
      - scene_time_of_day
      - scene_in_out
      - scene_emotion_keynote
      - character_state_change
    prompt: prompts/storyboard_hints.jinja
    output_mode: single_call

  - id: storyboard_prop
    scope: plot_unit
    dims: [prop_focus]
    prompt: prompts/storyboard_prop.jinja
    output_mode: single_call

  - id: storyboard_reference
    scope: plot_unit
    dims: [shot_suggestion]
    prompt: prompts/storyboard_reference.jinja
    output_mode: single_call

  - id: character_attrs
    scope: character
    dims:
      - character_archetype
      - character_role_in_arc
      - character_arc_type
      - character_agency_level
    prompt: prompts/character_attrs.jinja
    output_mode: single_call

  - id: relationship_attrs
    scope: relationship
    dims:
      - relationship_type
      - relationship_polarity
      - relationship_dynamic_arc
      - relationship_triangle
    prompt: prompts/relationship_attrs.jinja
    output_mode: single_call

scope:
  script:
    - dim: drama_tags
      kind: llm
      cardinality: multi
      open_enum: true
      stability_state: stable
      values:
        - 乡村
        - 亲情
        - 先婚后爱
        - 剧情
        - 历史古代
        - 古代
        - 古风权谋
        - 大女主
        - 大男主
        - 奇幻脑洞
        - 女强
        - 女性成长
        - 女频
        - 婆媳
        - 实拍
        - 家庭伦理
        - 年代
        - 年代爱情
        - 强者回归
        - 总裁
        - 恋爱
        - 悬疑推理
        - 战神
        - 战神归来
        - 打脸虐渣
        - 无敌神医
        - 极品亲戚
        - 架空
        - 沙雕漫
        - 玄幻
        - 玄幻仙侠
        - 现代
        - 现代言情
        - 现言甜宠
        - 真人AI
        - 种田
        - 穿越
        - 系统
        - 职场
        - 脑洞
        - 豪门恩怨
        - 赘婿逆袭
        - 逆袭
        - 都市
        - 都市日常
        - 都市爱情
        - 都市玄幻
        - 重生
        - 闪婚
        - 马甲
        - 黑道

    - dim: gender_axis
      kind: llm
      cardinality: single
      stability_state: stable
      values: [male_lead, female_lead, dual_lead, unclear]

    - dim: world_setting
      kind: llm
      cardinality: single
      stability_state: stable
      values:
