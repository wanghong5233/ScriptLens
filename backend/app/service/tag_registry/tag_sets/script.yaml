        - son_in_law_counter
        - reborn_revenge
        - system_holder
        - transmigrator
        - hidden_heir
        - big_female
        - ceo_dominant
        - sweet_pet
        - genius_doctor
        - weak_to_strong
        - nanny_disguise
        - unclear

    - dim: antagonist_archetype
      kind: llm
      cardinality: single
      stability_state: stable
