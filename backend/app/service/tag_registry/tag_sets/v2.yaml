version: v2.0.0
extends: v1.0.0
description: "AIGC storyboard hints from docs/2026-05-26-剧本标签体系设计决策.md §4.3"
prompt_ver: "v2.0.0"
bundles:
  - id: v2_storyboard_hints
    scope: plot_unit
    dims:
      - scene_locale_type
      - scene_time_of_day
      - scene_in_out
      - scene_emotion_keynote
      - shot_suggestion
      - prop_focus
      - character_state_change
    prompt: prompts/v2/storyboard_hints.jinja
    output_mode: single_call
scope:
  plot_unit:
    - dim: scene_locale_type
      cardinality: single
      stability_state: proposed
      values:
        - modern_indoor
        - modern_outdoor
        - ancient_indoor
        - ancient_outdoor
        - fantasy_world
        - school
        - transport
        - unclear
    - dim: scene_time_of_day
      cardinality: single
      stability_state: proposed
      values: [day, night, dawn, dusk, unclear]
    - dim: scene_in_out
      cardinality: single
      stability_state: proposed
      values: [int, ext, mixed]
    - dim: scene_emotion_keynote
      cardinality: single
      stability_state: proposed
      values: [tense, romantic, sad, happy, comedic, epic, eerie, calm]
    - dim: shot_suggestion
      cardinality: single
      stability_state: proposed
      values:
        - close_up
        - medium_shot
        - wide_shot
        - over_shoulder
        - push_in
        - pull_out
        - pan
        - tilt_up
        - tilt_down
        - tracking
        - mixed
        - unclear
    - dim: prop_focus
      cardinality: multi
      open_enum: true
      stability_state: proposed
      values:
        - sword
        - jade_pendant
        - token
        - contract
        - poison
        - antidote
        - letter
        - child
        - pet
    - dim: character_state_change
      cardinality: single
      stability_state: proposed
      values:
        - none
        - costume_change
        - makeup_change
        - injury
        - status_promotion
        - status_demotion
        - emotion_shift
        - identity_reveal
