# ============================================================
# 中文 AI 漫剧短剧投资决策评分 v4
# ============================================================
# 设计依据：docs/2026-05-31-投资决策评分框架-v4.md
#
# 修改本文件的纪律：
# - 任何阈值 / 权重 / 关键词都集中在本文件 / libraries/*.yaml / signals/_keywords.yaml
# - Python 代码不允许出现裸阈值数字、裸业务关键词字符串
# - 调阈值不需要 release：改 yaml → 重启服务即生效（同 OpenAI Evals / DSPy 惯例）
# ============================================================

version: "v4-cn-2026-05-31"
status: "active"
locale: "cn"
description: "中文 AI 漫剧短剧投资决策评分 v4：5 维 + 合规 gate"

# ============================================================
# 5 个维度
# ============================================================
#
# 字段说明：
# - weight:                 维度在最终聚合中的权重，所有维度 weight 之和必须 = 1.0
# - is_dealbreaker:         true 时，本维度分数低于 aggregation.dealbreaker_threshold
#                           会触发 force_not_recommended
# - signals.*.weight_in_dim:本维度内 signal 权重之和必须 = 1.0
# - signals.*.source:       rule | llm_judge | hybrid
# - signals.*.tier_anchor:  signal raw_value 落档锚点（high/mid_high/mid_low/low）
# - signals.*.tier_scores:  各档对应的最终得分（0-10）。同样禁止 Python 硬编码
# ============================================================

dimensions:

  hook:
    weight: 0.25
    is_dealbreaker: true
    label: "HOOK 抓人力"
    description: "用户会不会 8 秒内划走？"
    signals:
      - key: opening_30char_conflict
        source: hybrid
        weight_in_dim: 0.25
        params:
          char_window: 30
          first_scene_count: 1
          # hybrid 触发阈值：规则 raw < 0.5（即首场没命中关键词）就调 LLM 兜底
          hybrid_llm_trigger_threshold: 0.5
          # LLM 兜底时给 LLM 看的首场截取字数
          judge_excerpt_chars: 800
        tier_anchor:
          high: 1.0
          mid_high: 0.6
          mid_low: 0.3
          low: 0.0
        tier_scores:
          high: 9.0
          mid_high: 7.0
          mid_low: 5.0
          low: 2.0
        reference: "抖音 2024 短剧 SOP §1：8 秒决策窗口 + 字节 WebConf 2026 短剧质量评测 §3.1 hybrid"

      - key: first_3_scene_hook_chain
        source: rule
        weight_in_dim: 0.20
        params:
          window_scene_count: 3
        tier_anchor:
          high: 1.0
          mid_high: 0.67
          mid_low: 0.34
          low: 0.0
        tier_scores:
          high: 9.0
          mid_high: 7.0
          mid_low: 5.0
          low: 2.0
        reference: "ReelShort/GoodShort writer SOP: 前 3 场连续钩子链"

      - key: episode_end_cliffhanger_rate
        source: hybrid
        weight_in_dim: 0.30
        # 数据来自 cliffhanger_extractor LLM 二级判定 + verbatim quote 校验，
        # 5 类 cliff_type（physical_danger / emotional_reveal / false_defeat /
        # interrupted_moment / mystery_setup）。本信号仅做覆盖率聚合。
        params: {}
        tier_anchor:
          high: 0.6
          mid_high: 0.4
          mid_low: 0.2
          low: 0.0
        tier_scores:
          high: 9.0
          mid_high: 7.0
          mid_low: 5.0
          low: 2.0
        reference: "字节 WebConf 2026 Short Drama QA §3.2 cliffhanger taxonomy + ReelShort writer SOP"

      - key: first_minute_inciting_incident
        source: llm_judge
        weight_in_dim: 0.25
        prompt_id: hook_first_minute
        params:
          judge_scene_count: 2
          judge_excerpt_chars_per_scene: 600
        tier_anchor:
          high: 1.0
          mid_high: 0.7
          mid_low: 0.4
          low: 0.0
        tier_scores:
          high: 9.0
          mid_high: 7.0
          mid_low: 5.0
          low: 2.0
        reference: "ReelShort writer SOP: minute-1 inciting incident"

  archetype:
    weight: 0.20
    is_dealbreaker: true
    label: "ARCHETYPE 模板力"
    description: "算法和用户能否 1 秒识别？"
    signals:
      - key: genre_archetype_match
        source: rule
        weight_in_dim: 0.45
        params:
          match_threshold: 0.30
          archetype_library: "archetypes_cn"
          text_scene_count: 5
          text_chars_per_scene: 500
        tier_anchor:
          high: 0.70
          mid_high: 0.45
          mid_low: 0.25
          low: 0.0
        tier_scores:
          high: 9.0
          mid_high: 7.0
          mid_low: 5.0
          low: 2.0
        reference: "抖音红果选品 SOP §2：1 秒题材识别 / ReelShort comparable archetype"

      - key: character_archetype_match
        source: rule
        weight_in_dim: 0.35
        params:
          top_n_characters: 3
          archetype_library: "character_archetypes_cn"
        tier_anchor:
          high: 0.66
          mid_high: 0.34
          mid_low: 0.17
          low: 0.0
        tier_scores:
          high: 9.0
          mid_high: 7.0
          mid_low: 5.0
          low: 2.0

      - key: differentiation_gap
        source: llm_judge
        weight_in_dim: 0.20
        prompt_id: archetype_differentiation
        tier_anchor:
          high: 1.0
          mid_high: 0.7
          mid_low: 0.4
          low: 0.0
        tier_scores:
          high: 8.5
          mid_high: 7.0
          mid_low: 5.5
          low: 3.0

  payoff:
    weight: 0.20
    is_dealbreaker: true
    label: "PAYOFF 爽感力"
    description: "看到付费集前能不能持续给爽点？"
    # v4 评分准确度强化：新增 emotion_payoff_quality LLM judge（占 30%），
    # 4 个 rule 信号权重等比例下调（35/25/25/15 → 25/18/17/10）。
    signals:
      - key: reward_density_per_episode
        source: rule
        weight_in_dim: 0.25
        tier_anchor:
          high: 1.5
          mid_high: 1.0
          mid_low: 0.5
          low: 0.0
        tier_scores:
          high: 9.0
          mid_high: 7.0
          mid_low: 5.0
          low: 2.0
        reference: "抖音短剧爆款公式 2024 §4：平均 1.5 爽点/集起步"

      - key: twist_density_per_episode
        source: rule
        weight_in_dim: 0.18
        tier_anchor:
          high: 0.5
          mid_high: 0.3
          mid_low: 0.15
          low: 0.0
        tier_scores:
          high: 9.0
          mid_high: 7.0
          mid_low: 5.0
          low: 3.0

      - key: max_dry_streak_normalized
        source: rule
        weight_in_dim: 0.17
        # raw_value: 1 - (max_dry_streak / total_episodes)，越大越好
        tier_anchor:
          high: 0.90
          mid_high: 0.75
          mid_low: 0.50
          low: 0.0
        tier_scores:
          high: 9.0
          mid_high: 7.0
          mid_low: 5.0
          low: 2.0

      - key: episode_reward_coverage
        source: rule
        weight_in_dim: 0.10
        # raw_value: 有 reward 的集数 / 总集数
        tier_anchor:
          high: 0.80
          mid_high: 0.60
          mid_low: 0.35
          low: 0.0
        tier_scores:
          high: 9.0
          mid_high: 7.0
          mid_low: 5.0
          low: 2.0

      - key: emotion_payoff_quality
        source: llm_judge
        weight_in_dim: 0.30
        prompt_id: payoff_emotion_intensity
        params:
          reward_sample_count: 4
          reward_sample_chars: 400
        # raw_value: LLM intensity_score（0-1）
        tier_anchor:
          high: 0.80
          mid_high: 0.65
          mid_low: 0.45
          low: 0.0
        tier_scores:
          high: 9.0
          mid_high: 7.0
          mid_low: 5.0
          low: 2.5
        reference: "G-Eval (Liu et al, EMNLP 2023) + ReelShort writer SOP《Reward design》"

  monetization:
    weight: 0.20
    is_dealbreaker: false
    label: "MONETIZATION 变现力"
    description: "付费拐点设计是否合理？"
    # v4 评分准确度强化：新增 paywall_hook_quality LLM judge（占 30%），
    # 4 个 rule 信号权重等比例下调（35/25/25/15 → 25/18/17/10）。
    # 这里下调 rule weight 因为付费转化是质量判断，纯关键词匹配 FN 率 35%+。
    signals:
      - key: paywall_cliffhanger_strength
        source: hybrid
        weight_in_dim: 0.25
        # 数据来自 cliffhanger_extractor。cliff_type 加权（业内字节 WebConf 2026 §3.2
        # 实证：physical_danger / false_defeat 平均付费转化率 > emotional_reveal >
        # interrupted_moment > mystery_setup）。
        params:
          paywall_min_episode: 15
          paywall_max_episode: 20
          type_weight_physical_danger: 1.0
          type_weight_false_defeat: 1.0
          type_weight_emotional_reveal: 0.85
          type_weight_interrupted_moment: 0.7
          type_weight_mystery_setup: 0.55
        tier_anchor:
          high: 1.0
          mid_high: 0.6
          mid_low: 0.3
          low: 0.0
        tier_scores:
          high: 9.0
          mid_high: 7.0
          mid_low: 5.0
          low: 3.0
        reference: "短剧典型付费拐点位于第 15-20 集；字节 WebConf 2026 §3.2 cliff_type 加权"

      - key: post_paywall_payoff_density
        source: rule
        weight_in_dim: 0.18
        params:
          paywall_min_episode: 15
          paywall_max_episode: 20
          post_paywall_window: 3
        # raw_value: 付费首 3 集 reward 数 / 3
        tier_anchor:
          high: 1.5
          mid_high: 1.0
          mid_low: 0.5
          low: 0.0
        tier_scores:
          high: 9.0
          mid_high: 7.0
          mid_low: 5.0
          low: 3.0

      - key: episode_end_hook_grade
        source: hybrid
        weight_in_dim: 0.17
        # 数据来自 cliffhanger_extractor。与 HOOK.episode_end_cliffhanger_rate 同源，
        # 但本维度切点更严苛（关注付费节奏稳定性）。
        params: {}
        # raw_value: AI 判读集末有强留钩的集数 / 总集数
        tier_anchor:
          high: 0.70
          mid_high: 0.50
          mid_low: 0.30
          low: 0.0
        tier_scores:
          high: 9.0
          mid_high: 7.0
          mid_low: 5.0
          low: 3.0

      - key: paid_arc_twist_pacing
        source: rule
        weight_in_dim: 0.10
        params:
          paywall_min_episode: 15
          paywall_max_episode: 20
        # raw_value: 1 / 付费段平均反转间隔集数 （间隔 5 集即 0.2，目标 ≥0.15）
        tier_anchor:
          high: 0.25
          mid_high: 0.15
          mid_low: 0.08
          low: 0.0
        tier_scores:
          high: 9.0
          mid_high: 7.0
          mid_low: 5.0
          low: 3.0

      - key: paywall_hook_quality
        source: llm_judge
        weight_in_dim: 0.30
        prompt_id: monetization_paywall_hook
        params:
          paywall_min_episode: 15
          paywall_max_episode: 20
          scene_excerpt_chars: 800
        # raw_value: LLM hook_strength（0-1）
        tier_anchor:
          high: 0.80
          mid_high: 0.65
          mid_low: 0.45
          low: 0.0
        tier_scores:
          high: 9.0
          mid_high: 7.0
          mid_low: 5.0
          low: 3.0
        reference: "G-Eval + 字节 WebConf 2026 短剧质量评测 §4.2"

  producibility:
    weight: 0.15
    is_dealbreaker: false
    label: "PRODUCIBILITY 可生成力"
    description: "AI 视频生成成本和可行性？"
    # 注意：本维度大部分 signal 是"越低越好"（成本越低 = 越易生成）。
    # 在 tier_anchor 中体现为"raw_value 越小档位越高"——signal 计算函数会做归一化。
    signals:
      - key: scene_count_per_episode_ratio_inv
        source: rule
        weight_in_dim: 0.15
        params:
          normalize_low: 3.0
          normalize_high: 10.0
        # raw_value: 1 - normalize(场景数/集数, low=3, high=10)；值越大越易生成
        tier_anchor:
          high: 0.80
          mid_high: 0.60
          mid_low: 0.40
          low: 0.0
        tier_scores:
          high: 8.5
          mid_high: 7.0
          mid_low: 5.0
          low: 3.0

      - key: concurrent_characters_max_inv
        source: rule
        weight_in_dim: 0.20
        params:
          normalize_low: 2.0
          normalize_high: 8.0
        # raw_value: 1 - normalize(单场最大同时在场角色, low=2, high=8)
        tier_anchor:
          high: 0.80
          mid_high: 0.55
          mid_low: 0.30
          low: 0.0
        tier_scores:
          high: 8.5
          mid_high: 7.0
          mid_low: 5.0
          low: 3.0

      - key: special_scene_ratio_inv
        source: rule
        weight_in_dim: 0.25
        # raw_value: 1 - 特殊场景比；特殊场景定义在 signals/_keywords.yaml special_scene
        tier_anchor:
          high: 0.95
          mid_high: 0.85
          mid_low: 0.70
          low: 0.0
        tier_scores:
          high: 9.0
          mid_high: 7.0
          mid_low: 5.0
          low: 2.5

      - key: outdoor_ratio_inv
        source: rule
        weight_in_dim: 0.10
        params:
          head_chars: 80
        # raw_value: 1 - 室外场景比
        tier_anchor:
          high: 0.80
          mid_high: 0.60
          mid_low: 0.40
          low: 0.0
        tier_scores:
          high: 8.5
          mid_high: 7.0
          mid_low: 5.0
          low: 3.5

      - key: dialogue_density_per_scene_inv
        source: rule
        weight_in_dim: 0.10
        params:
          normalize_low: 3.0
          normalize_high: 25.0
        # raw_value: 1 - normalize(平均每场对白行数, low=3, high=25)
        tier_anchor:
          high: 0.75
          mid_high: 0.50
          mid_low: 0.25
          low: 0.0
        tier_scores:
          high: 8.0
          mid_high: 7.0
          mid_low: 5.5
          low: 4.0

      - key: multi_character_continuity_load
        source: rule
        weight_in_dim: 0.20
        params:
          normalize_low: 3.0
          normalize_high: 15.0
        # raw_value: 1 - normalize(跨集复现角色数, low=3, high=15)；
        # 数量越多越烧 LoRA / reference image
        tier_anchor:
          high: 0.70
          mid_high: 0.50
          mid_low: 0.30
          low: 0.0
        tier_scores:
          high: 8.5
          mid_high: 7.0
          mid_low: 5.0
          low: 3.0


# ============================================================
# 聚合算法（aggregator.py 通过 AggregationConfig 注入，零硬编码）
# ============================================================
aggregation:
  type: "gated_multiplicative"
  dealbreaker_dims:
    - "hook"
    - "archetype"
    - "payoff"
  dealbreaker_threshold: 3.0
  dealbreaker_action: "force_not_recommended"
  verdict_cuts:
    qualified_overall_min: 7.0
    qualified_floor_min: 5.0
    needs_polish_overall_min: 5.5
  # Verdict 三档展示文案（前端从 rubric 读，不在 Python 中硬编码）
  verdicts:
    qualified:
      label: "qualified"
      display_cn: "达标进入下一环节"
      display_en: "Qualified for next stage"
    needs_polish:
      label: "needs_polish"
      display_cn: "待打磨复评"
      display_en: "Needs polish, re-evaluate"
    not_recommended:
      label: "not_recommended"
      display_cn: "不建议立项"
      display_en: "Not recommended"

# ============================================================
# 合规独立 gate（与维度评分并列）
# ============================================================
compliance:
  is_independent_gate: true
  veto_tier: "high_risk"
  high_risk_action: "veto"

# ============================================================
# Confidence 计算（覆盖率 + LLM judge 失败率）
# ============================================================
confidence:
  high_min_coverage: 0.80
  medium_min_coverage: 0.50
  max_llm_judge_failures_for_high: 1
  max_llm_judge_failures_for_medium: 3

# ============================================================
# 文本字段截断（reason / improvement / evidence excerpt）
# 禁止 Python 内 inline `[:N]` / `max_len=N`，全部经此配置
# ============================================================
truncation:
  reason_max_chars: 120
  evidence_excerpt_max_chars: 80
  improvement_rationale_max_chars: 140

# ============================================================
# Top improvements 生成器
# ============================================================
improvement_planner:
  max_actions: 3
  # 仅 score < 此阈值的 signal 才会进入候选改进项
  min_signal_score_to_recommend: 6.0
  # signal 提升能让 dimension tier 升 1 档时的预计 verdict lift 文案；
  # tier 升 1 档的实际定义是 aggregator 内的 tier_cuts 比较
  expected_verdict_lift_template_cn: "{from_verdict} → {to_verdict}"

# ============================================================
# Tier 落档（DimensionScore.tier）
# ============================================================
dimension_tier_cuts:
  high: 8.0
  mid_high: 6.5
  mid_low: 5.0
  # 低于 mid_low 即 low
