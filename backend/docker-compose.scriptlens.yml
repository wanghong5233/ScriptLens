# ============================================================
# ScriptLens compose overlay（不独立部署，叠加到 ScholarMind compose）
#
# 设计原则（来自 docs/00-reuse-matrix.md §1 §8）：
#   1. 只新增 1 个容器 scriptlens_api（端口 8005）
#   2. 共享 ScholarMind 的 PG（独立 schema scriptlens）
#   3. 共享 ScholarMind 的 Redis（独立 db REDIS_DB=1）
#   4. 共享 ScholarMind 的 cloudflared tunnel（在 CF Zero Trust 加 hostname）
#   5. 共享同一个 docker network（不重复定义）
#
# 启动方式（详见 README.deploy.md）：
#   cd /opt/apps   # 父目录，scholarmind 和 scriptlens 是兄弟目录
#   docker compose \
#     -f scholarmind/backend/docker-compose.prod.yml \
#     -f scriptlens/backend/docker-compose.scriptlens.yml \
#     --project-name scholarmind \
#     up -d
#
# 此文件不独立可用（依赖 ScholarMind compose 提供 db/redis/network）。
# ============================================================

services:
  scriptlens_api:
    build:
      # context 解析基准是本 compose 文件所在目录（ScriptLens/backend/）
      context: .
      dockerfile: ./app/Dockerfile
    container_name: scriptlens_api
    hostname: scriptlens_api
    env_file:
      - .env.scriptlens
    environment:
      # 复用 ScholarMind 的 PG，独立 schema 由 alembic migration 创建
      DATABASE_URL: ${SCRIPTLENS_DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-pg123456}@scholarmind_db:5432/${POSTGRES_DB:-scholarmind}}
      # 复用 ScholarMind 的 Redis，独立 db
      REDIS_HOST: ${REDIS_HOST:-scholarmind_redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${SCRIPTLENS_REDIS_DB:-1}
      # 短剧场景：本地 pymupdf 已够用，不走 llamaparse / unstructured 节省外部 API 调用
      SM_PARSER_ORDER: pymupdf
      SM_VECTOR_STORE: pgvector
      SM_GROBID_ENABLED: "false"
      SM_RERANKER_TYPE: dashscope
      SM_EMBEDDER_TYPE: dashscope
      SM_EMBEDDING_MODEL: text-embedding-v3
      SM_EMBEDDING_DIMENSIONS: "1024"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
    command:
      [
        "uvicorn",
        "app_main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8005",
        "--workers",
        "1",
        "--timeout-graceful-shutdown",
        "10",
      ]
    volumes:
      # 剧本原始文件落盘（ECS 上需先 mkdir -p /opt/data/scriptlens/storage）
      - ${SCRIPTLENS_STORAGE_ROOT:-/opt/data/scriptlens/storage}:/app/service/core/storage
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8005/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      # 依赖 ScholarMind compose 提供的 service（必须在同一 compose project 启动）
      scholarmind_db:
        condition: service_started
      scholarmind_redis:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - scholarmind_net

# 注意：networks / volumes 不在此处再次定义。
# 当本文件作为 -f overlay 与 ScholarMind compose 一起启动时，
# scholarmind_net / pg_data / redis_data 已由 prod.yml 定义，会自动合并。
