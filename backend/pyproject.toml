[project]
name = "scriptlens"
version = "0.1.0"
description = "A screenplay and web-novel analysis agent for fast grounded story understanding."
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "pydantic",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
